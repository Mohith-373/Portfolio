name: Redirect GitHub Pages to Cloudflare

# The portfolio is built and hosted by Cloudflare Pages at https://mohith-tk.pages.dev.
# This workflow keeps the old address (mohith-373.github.io/Portfolio) working by
# publishing a tiny page that forwards every path to the same path on the new site.

on:
  push:
    branches: [main]
    paths: ["redirect/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./redirect
      - name: Deploy redirect to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
